<article class="portfolio" data-page="portfolio">

  <header>
    <h2 class="h2 article-title">Portfolio</h2>
  </header>

  <section class="projects">

    <ul class="filter-list">
      {% for cat in site.data.projects.categories %}
      <li class="filter-item">
        <button class="{% if forloop.first %}active{% endif %}" data-filter-btn>{{ cat.name }}</button>
      </li>
      {% endfor %}
    </ul>

    <div class="filter-select-box">

      <button class="filter-select" data-select>

        <div class="select-value" data-selecct-value>Select category</div>

        <div class="select-icon">
          <ion-icon name="chevron-down"></ion-icon>
        </div>

      </button>

      <ul class="select-list">
        {% for cat in site.data.projects.categories %}
        <li class="select-item">
          <button data-select-item>{{ cat.name }}</button>
        </li>
        {% endfor %}
      </ul>

    </div>

    <ul class="project-list">
      {% for item in site.data.projects.items %}
      <li class="project-item  active" data-filter-item data-category="{{ item.category_slug }}">
        <a href="{{ item.link }}" target="_blank">

          <figure class="project-img">
            <div class="project-item-icon-box">
              <ion-icon name="eye-outline"></ion-icon>
            </div>

            <img src="{{ item.image }}" alt="{{ item.alt }}" loading="lazy">
          </figure>

          <h3 class="project-title">{{ item.title }}</h3>

          <p class="project-category">{{ item.category }}</p>

        </a>
      </li>
      {% endfor %}
    </ul>

  </section>

</article>
